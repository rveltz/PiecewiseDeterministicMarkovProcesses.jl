name: CI
on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly upstream-drift check

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
        os: [ubuntu-latest]
        include:
          - version: '1.11'
            os: macos-latest
          - version: '1.11'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtests@v1

  precompile-check:
    name: Precompile check (Julia 1.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
            Pkg.precompile(strict=true)'
